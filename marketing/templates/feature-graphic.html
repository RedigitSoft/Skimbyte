<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: #0E0E0E;
    color: #F2F1EF;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(700px 420px at 82% 30%, #7C5CFC, transparent 70%),
      radial-gradient(500px 400px at -5% 110%, #EB5E28, transparent 70%);
    opacity: 0.17;
  }
  .text {
    position: absolute; left: 64px; top: 50%; transform: translateY(-50%);
    width: 560px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 19px; font-weight: 600;
  }
  .brand img { width: 26px; height: 26px; border-radius: 6px; display: block; }
  h1 {
    margin-top: 22px;
    font-size: 56px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em;
  }
  h1 em { font-style: normal; color: #9D85FF; }
  .sub {
    margin-top: 18px;
    font-size: 19px; line-height: 1.5; letter-spacing: -0.01em;
    color: #AFADA8;
  }
  .chips { margin-top: 24px; display: flex; gap: 8px; }
  .chips span {
    font-size: 14px; font-weight: 600;
    border: 1px solid #3A3A3A; border-radius: 999px;
    padding: 7px 16px; color: #F2F1EF;
  }
  .phone {
    position: absolute; right: 70px; top: 54px;
    width: 300px;
    background: #050505;
    border-radius: 50px; padding: 11px;
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,0.16),
      0 44px 90px -28px rgba(0,0,0,0.8);
  }
  .phone img { width: 100%; border-radius: 40px; display: block; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="text">
  <div class="brand"><img src="../../website/app-icon.svg" alt="">Skimbyte</div>
  <h1>The day's developer news. <em>Skimmed.</em></h1>
  <p class="sub">A once-a-day brief of short, readable summaries from the mobile-dev firehose. Free &amp; open source. No ads, no tracking.</p>
  <div class="chips"><span>Kotlin</span><span>Swift</span><span>Flutter</span><span>AI</span><span>+5 more</span></div>
</div>
<div class="phone"><img src="../shots/feed-dark.png" alt=""></div>
</body>
</html>
