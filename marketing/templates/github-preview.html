<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: #0E0E0E;
    color: #F2F1EF;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(800px 500px at 85% 10%, #7C5CFC, transparent 70%),
      radial-gradient(600px 480px at 0% 120%, #EB5E28, transparent 72%);
    opacity: 0.18;
  }
  .text {
    position: absolute; left: 70px; top: 50%; transform: translateY(-50%);
    width: 430px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 600;
  }
  .brand img { width: 28px; height: 28px; border-radius: 7px; display: block; }
  h1 {
    margin-top: 24px;
    font-size: 47px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em;
  }
  h1 em { font-style: normal; color: #9D85FF; }
  .sub {
    margin-top: 18px;
    font-size: 18px; line-height: 1.5; letter-spacing: -0.01em;
    color: #AFADA8;
  }
  .sub b { color: #F2F1EF; font-weight: 600; }
  .meta {
    margin-top: 26px;
    display: flex; align-items: center; gap: 9px;
    font-size: 14.5px; font-weight: 600;
  }
  .meta span {
    border: 1px solid #3A3A3A; border-radius: 999px; padding: 7px 13px;
    white-space: nowrap; font-size: 13px;
  }
  .window {
    position: absolute; left: 700px; top: 110px;
    width: 740px;
    background: #1C1C1C;
    border-radius: 14px;
    box-shadow: 0 50px 110px -30px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  .titlebar {
    height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 14px;
    background: #242424;
  }
  .titlebar i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .titlebar i:nth-child(1) { background: #FF5F57; }
  .titlebar i:nth-child(2) { background: #FEBC2E; }
  .titlebar i:nth-child(3) { background: #28C840; }
  .window img { width: 100%; display: block; }
  .phone {
    position: absolute; left: 572px; top: 170px;
    width: 200px;
    background: #050505;
    border-radius: 32px; padding: 8px;
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,0.16),
      0 40px 80px -24px rgba(0,0,0,0.8);
  }
  .phone .screen { position: relative; overflow: hidden; border-radius: 29px; background: #F7F6F3; padding-top: 24px; }
  .phone img { width: 100%; border-radius: 0; }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    height: 24px; padding: 0 15px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 9.5px; font-weight: 600; color: #1A1A18; letter-spacing: 0;
    font-family: system-ui, sans-serif;
  }
  .statusbar svg { display: block; }
  .homebar {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 38%; height: 3px; border-radius: 999px; background: #1A1A18; opacity: .85; z-index: 2;
  }
  .hole {
    position: absolute; top: 7px; left: 50%; transform: translateX(-50%);
    width: 9px; height: 9px; border-radius: 50%; background: #050505; z-index: 3;
  }
  .phone::after {
    content: ""; position: absolute; right: -2px; top: 22%;
    width: 2.5px; height: 40px; border-radius: 2px; background: #1C1C1C;
    box-shadow: 0 50px 0 #1C1C1C;
  }

</style>
</head>
<body>
<div class="glow"></div>
<div class="window">
  <div class="titlebar"><i></i><i></i><i></i></div>
  <img src="../shots/desktop-light.png" alt="">
</div>
<div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><svg width="36" height="10" viewBox="0 0 44 12" fill="currentColor"><path d="M1 6.2a10 10 0 0 1 12 0l-2.2 2.4a6.6 6.6 0 0 0-7.6 0z"/><circle cx="7" cy="10" r="1.7"/><path d="M18 12 28 12 28 1z"/><rect x="33" y="1" width="6" height="11" rx="1.6"/></svg></div>
  <div class="hole"></div>
  <img src="../shots/feed-light.png" alt="">
  <div class="homebar"></div>
</div></div>
<div class="text">
  <div class="brand"><img src="../../website/app-icon.svg" alt="">Skimbyte</div>
  <h1>One Kotlin codebase. <em>Every platform.</em></h1>
  <p class="sub">An open-source daily brief for developer news — <b>Kotlin Multiplatform + Compose</b> on Android, iOS, desktop &amp; web.</p>
  <div class="meta"><span>Apache-2.0</span><span>Compose Multiplatform</span><span>Demo mode built in</span></div>
</div>
</body>
</html>
