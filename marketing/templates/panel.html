<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --offwhite: #F7F6F3;
    --ink: #1A1A18;
    --ink-muted: #5B5A55;
    --black: #0E0E0E;
    --mist: #F2F1EF;
    --mist-muted: #AFADA8;
    --accent: #7C5CFC;
    --sans: system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 430px; height: 932px; overflow: hidden; }
  body {
    font-family: var(--sans);
    background: var(--offwhite);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  body.dark { background: var(--black); color: var(--mist); }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(420px 320px at 50% -8%, var(--accent), transparent 70%);
    opacity: 0.16;
  }
  body.dark .glow { opacity: 0.22; }
  .brand {
    position: relative;
    margin: 44px auto 0; width: fit-content;
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  }
  .brand img { width: 20px; height: 20px; border-radius: 5px; display: block; }
  h1 {
    position: relative;
    margin: 18px auto 0; padding: 0 30px;
    text-align: center;
    font-size: 39px; line-height: 1.07; font-weight: 700; letter-spacing: -0.025em;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .sub {
    position: relative;
    margin: 14px auto 0; padding: 0 44px;
    text-align: center;
    font-size: 17.5px; line-height: 1.45; letter-spacing: -0.01em;
    color: var(--ink-muted);
  }
  body.dark .sub { color: var(--mist-muted); }
  .phone {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: -72px;
    width: 326px;
    background: #050505;
    border-radius: 54px; padding: 12px;
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,0.16),
      0 44px 90px -28px rgba(10,10,10,0.55),
      0 10px 26px -12px rgba(10,10,10,0.35);
  }
  .screen {
    border-radius: 43px; overflow: hidden;
    background: #0D0D0D; padding-top: 30px;
  }
  body:not(.dark) .screen { background: #F7F6F3; }
  .screen.sd { background: #0D0D0D !important; }
  .screen.sl { background: #F7F6F3 !important; }
  .phone img { width: 100%; display: block; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="brand"><img id="icon" src="../../website/app-icon.svg" alt="">Skimbyte</div>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="phone"><div class="screen" id="screen"><img id="shot" src="" alt=""></div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.body.classList.add('dark');
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', '#' + q.get('accent'));
  document.getElementById('title').innerHTML = q.get('title') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
  document.getElementById('shot').src = '../shots/' + (q.get('img') || '');
  // screen background matches the screenshot's theme, which can differ from the panel theme
  if (q.get('screen')) document.getElementById('screen').classList.add(q.get('screen') === 'dark' ? 'sd' : 'sl');
</script>
</body>
</html>
