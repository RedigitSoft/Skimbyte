<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 810px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: #F7F6F3;
    color: #1A1A18;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 560px at 50% -10%, #EC4899, transparent 70%),
      radial-gradient(700px 500px at 100% 110%, #7C5CFC, transparent 72%);
    opacity: 0.12;
  }
  .head {
    position: absolute; top: 64px; left: 0; right: 0;
    text-align: center;
  }
  .brand {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 18px; font-weight: 600;
  }
  .brand img { width: 24px; height: 24px; border-radius: 6px; display: block; }
  h1 {
    margin-top: 16px;
    font-size: 54px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em;
  }
  .sub { margin-top: 12px; font-size: 19px; color: #5B5A55; letter-spacing: -0.01em; }
  .window {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: 272px;
    width: 1080px;
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 60px 130px -34px rgba(26,26,24,0.4), 0 14px 34px -16px rgba(26,26,24,0.25);
    overflow: hidden;
  }
  .titlebar {
    height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 16px;
    background: #EBE9E4;
  }
  .titlebar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .titlebar i:nth-child(1) { background: #FF5F57; }
  .titlebar i:nth-child(2) { background: #FEBC2E; }
  .titlebar i:nth-child(3) { background: #28C840; }
  .window img { width: 100%; display: block; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="head">
  <div class="brand"><img src="../../website/app-icon.svg" alt="">Skimbyte</div>
  <h1>Your daily brief, on the big screen.</h1>
  <p class="sub">Native desktop builds for macOS, Windows &amp; Linux — the same Kotlin codebase as the phone app.</p>
</div>
<div class="window">
  <div class="titlebar"><i></i><i></i><i></i></div>
  <img src="../shots/desktop-light.png" alt="">
</div>
</body>
</html>
