<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: #F7F6F3;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  body.dark { background: #161614; }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated;
  }
  .lockup {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 36px;
  }
  .lockup img { width: 560px; display: block; }
  .tagline {
    font-size: 34px; font-weight: 600; letter-spacing: -0.01em;
    color: #4C4B46;
  }
  body.dark .tagline { color: #AFADA8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="lockup">
  <img id="wordmark" src="assets/wordmark-oxblood.svg" alt="Skimbyte">
  <div class="tagline">The day's developer news. Skimmed.</div>
</div>
<script>
  // Demo-post placeholder: the Skimbyte wordmark over a static Bayer-dithered field in the
  // brand neutrals — oxblood on off-white for light, mist on ink for dark.
  const q = new URLSearchParams(location.search);
  const dark = q.get('theme') === 'dark';
  if (dark) {
    document.body.classList.add('dark');
    document.getElementById('wordmark').src = 'assets/wordmark-mist.svg';
  }

  const c = document.getElementById('c');
  const PX = 10;
  const w = c.width = Math.round(1600 / PX);
  const h = c.height = Math.round(1000 / PX);
  const ctx = c.getContext('2d');
  const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].flat().map(v => (v + 0.5) / 16);
  const img = ctx.createImageData(w, h);
  const rgba = dark ? [255, 255, 255, 14] : [138, 135, 125, 52];
  const d = img.data;
  const seed = +(q.get('seed') || 3);
  for (let y = 0; y < h; y++) {
    const dy = y / h - 0.5;
    for (let x = 0; x < w; x++) {
      const dx = x / w - 0.5;
      let v = Math.sin(x * 0.24 + seed) + Math.sin(y * 0.21 - seed * 0.7) + Math.sin((x + y) * 0.11 + seed * 0.5);
      v = (v / 3 + 1) / 2;
      // strongest at the edges, clear in the middle where the wordmark sits
      v *= Math.min(1, Math.max(0, 2.2 * Math.hypot(dx * 1.3, dy) - 0.25));
      const on = v > BAYER[(y % 4) * 4 + (x % 4)];
      const i = (y * w + x) * 4;
      d[i] = rgba[0]; d[i + 1] = rgba[1]; d[i + 2] = rgba[2];
      d[i + 3] = on ? rgba[3] : 0;
    }
  }
  ctx.putImageData(img, 0, 0);
</script>
</body>
</html>
