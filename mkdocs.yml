site_name: Skimbyte
site_description: A daily, skimmable developer-news brief — one shared Compose codebase on Android, iOS, Desktop, and Web.
site_url: https://skimbyte.com/docs/
repo_name: Skimbyte
repo_url: https://github.com/RedigitSoft/Skimbyte
docs_dir: docs-site

theme:
  name: material
  logo: assets/app-icon.svg
  favicon: assets/app-icon.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

# The Dokka API reference (/api/) and live designsheet (/designsheet/) are deployed alongside
# this site by .github/workflows/deploy-site.yml, so they appear in nav as absolute URLs
# (relative non-doc paths would fail mkdocs --strict).
nav:
  - Home: index.md
  - Download: download.md
  - Architecture: architecture.md
  - Testing: testing.md
  - Design system: design-system.md
  - API reference: https://skimbyte.com/docs/api/
  - Live designsheet: https://skimbyte.com/docs/designsheet/
  - Privacy: privacy.md
  - Terms: terms.md
