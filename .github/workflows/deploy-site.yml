name: Deploy docs site to GitHub Pages

# One Pages deployment, three artifacts:
#   /            MkDocs site (docs-site/)
#   /api/        Dokka HTML for :shared
#   /designsheet/  the live component catalog (Wasm)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build designsheet (Wasm production bundle)
        run: ./gradlew :designsheet:wasmJsBrowserDistribution

      - name: Generate API docs (Dokka)
        run: ./gradlew :shared:dokkaGenerate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build MkDocs site
        run: |
          pip install mkdocs-material
          mkdocs build --strict --site-dir site

      - name: Assemble combined site
        run: |
          cp -r shared/build/dokka/html site/api
          cp -r designsheet/build/dist/wasmJs/productionExecutable site/designsheet

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
