name: Release desktop apps

# Packages the Compose desktop app on every OS and attaches the installers to the
# GitHub Release for the pushed tag: a signed + notarized DMG (macOS, arm64), an MSI
# (Windows, x64), and a DEB (Linux, x64).
#
# Trigger is v1+ tags only: jpackage requires a macOS package version with MAJOR >= 1,
# so desktop releases are tagged v1.0.0 upward. workflow_dispatch builds the installers
# as workflow artifacts without creating a release (useful for testing the pipeline).
#
# macOS signing needs these repository secrets (without them the DMG is built unsigned,
# which Gatekeeper rejects when downloaded — fine for testing, not for distribution):
#   MACOS_CERT_P12         base64 of a Developer ID Application cert + private key
#                          (Keychain Access -> export as .p12, then `base64 -i cert.p12`)
#   MACOS_CERT_PASSWORD    password chosen when exporting the .p12
#   MACOS_SIGNING_IDENTITY the cert's common name, e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARIZATION_APPLE_ID  Apple ID email of the developer account
#   NOTARIZATION_PASSWORD  app-specific password from appleid.apple.com (not the account password)
#   NOTARIZATION_TEAM_ID   10-character team id
#
# The Windows MSI is unsigned for now (needs a paid code-signing certificate; SmartScreen
# warns but installs). Candidate fix: SignPath's free open-source signing tier.

on:
  push:
    tags: ["v[1-9]*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "DESKTOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "DESKTOP_VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID certificate (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Package distribution
        env:
          MACOS_SIGNING_IDENTITY: ${{ env.HAS_MACOS_SIGNING == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS "-PskimbyteDesktopVersion=$DESKTOP_VERSION"

      - name: Notarize DMG (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: ./gradlew :desktopApp:notarizeDmg "-PskimbyteDesktopVersion=$DESKTOP_VERSION"

      - name: Add CPU architecture to installer names
        run: |
          cd desktopApp/build/compose/binaries/main
          for f in dmg/*.dmg msi/*.msi deb/*.deb; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.*}-$(uname -m).${f##*.}"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
