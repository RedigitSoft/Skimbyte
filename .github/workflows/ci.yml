name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Shared tests (JVM)
        run: ./gradlew :shared:jvmTest

      - name: Shared tests (Android host) + screenshot verify
        run: ./gradlew :shared:verifyRoborazziAndroidHostTest

      - name: Assemble Android app
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: |
            shared/build/outputs/roborazzi
            shared/src/androidHostTest/roborazzi/*_compare.png
          if-no-files-found: ignore